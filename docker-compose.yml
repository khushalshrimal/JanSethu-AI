version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jansethu_postgres
    restart: always
    environment:
      POSTGRES_USER: jansethu_user
      POSTGRES_PASSWORD: jansethu_secure_password_2026
      POSTGRES_DB: jansethudb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansethu_user -d jansethudb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jansethu_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://jansethu_user:jansethu_secure_password_2026@postgres:5432/jansethudb
      SECRET_KEY: jansethu_production_super_secret_key_change_me
      WEBHOOK_SECRET: jansethu_production_webhook_secret_key_2026
      PUBLIC_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      TELEPHONY_PROVIDER: development
      SMS_PROVIDER: development
    ports:
      - "8000:8000"

volumes:
  postgres_data:
